<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151023">
  <title>شاشة اللاعبين | جوّ</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./audience.js"></script>
</head>
<body>
  <main class="audience-wrap">
    <div class="stage-panel stage-center">
      <p class="small" id="audience-game">جوّ | شاشة اللاعبين</p>
      <h1 id="audience-title" aria-live="polite">بانتظار مدير الروم</h1>
      <p id="audience-status">افتح الشاشة من جولة المافيا أو وين اختبوا؟</p>
      <p id="audience-place" hidden></p>
      <p class="clock" id="audience-clock" role="timer" aria-label="الثواني الباقية" hidden></p>
      <p id="audience-counts" hidden></p>
      <ul class="score-list" id="audience-list" hidden></ul>
    </div>
  </main>
</body>
</html>
